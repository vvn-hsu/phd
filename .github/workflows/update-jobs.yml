name: 更新博士職缺

on:
  schedule:
    - cron: "0 5 * * *"      # 每天 UTC 05:00（台灣時間 13:00）
  workflow_dispatch:
    inputs:
      probe:
        description: "只測試來源、不寫檔"
        type: boolean
        default: false
      sniff:
        description: "偵查網址（空白分隔）；填了就只跑偵查"
        type: string
        default: ""
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/update-jobs.yml"

permissions:
  contents: write

concurrency:
  group: update-jobs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: 解析測試（不連網）
        run: python scraper/test_parse.py

      - name: 偵查網址
        if: ${{ inputs.sniff != '' }}
        env:
          SNIFF_URLS: ${{ inputs.sniff }}
        run: python scraper/sniff.py $SNIFF_URLS

      - name: 抓取職缺
        if: ${{ inputs.sniff == '' }}
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scraper/run.py --probe
          else
            python scraper/run.py
          fi

      - name: 提交更新後的資料
        if: ${{ inputs.probe != true && inputs.sniff == '' }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "資料沒有變化，不提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: 更新職缺資料 $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            sleep $((2 ** i))
          done
          exit 1
