name: 更新博士職缺

on:
  schedule:
    - cron: "0 5 * * *"      # 每天 UTC 05:00（台灣時間 13:00）
  workflow_dispatch:
    inputs:
      probe:
        description: "只測試來源、不寫檔"
        type: boolean
        default: false
      sniff:
        description: "偵查網址（空白分隔）；填了就只跑偵查"
        type: string
        default: ""
      sniff_text:
        description: "偵查時一併印出頁面文字"
        type: boolean
        default: false
  push:
    paths:
      - "scraper/**"
      - ".github/workflows/update-jobs.yml"

permissions:
  contents: write

concurrency:
  group: update-jobs
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - name: 解析測試（不連網）
        run: python scraper/test_parse.py

      - name: 偵查網址
        if: ${{ inputs.sniff != '' }}
        env:
          SNIFF_URLS: ${{ inputs.sniff }}
          SNIFF_TEXT: ${{ inputs.sniff_text && '1' || '' }}
        run: python scraper/sniff.py $SNIFF_URLS

      - name: 抓取職缺
        if: ${{ inputs.sniff == '' }}
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            python scraper/run.py --probe
          else
            python scraper/run.py
          fi

      - name: 提交更新後的資料
        if: ${{ inputs.probe != true && inputs.sniff == '' }}
        run: |
          if [ -z "$(git status --porcelain data)" ]; then
            echo "資料沒有變化，不提交。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/jobs.json 是整份重新產生的，不要跟遠端做三方合併（一定會衝突）。
          # 作法：先把這次的結果收到旁邊，對齊遠端，再把結果放回去。
          # 兩次執行重疊時以「後跑完的那次」為準，漏掉的職缺下一次會再抓到。
          mkdir -p "${RUNNER_TEMP}/out" && cp -r data/. "${RUNNER_TEMP}/out/"
          for i in 1 2 3 4; do
            git fetch origin "${GITHUB_REF_NAME}"
            git reset --hard FETCH_HEAD
            cp -r "${RUNNER_TEMP}/out/." data/
            if [ -z "$(git status --porcelain data)" ]; then
              echo "遠端已經是同樣的資料，不用提交。"
              exit 0
            fi
            git add data
            git commit -m "chore: 更新職缺資料 $(date -u +%Y-%m-%d)"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "推送失敗（可能有另一次執行同時推），第 ${i} 次重試"
            sleep $((2 ** i))
          done
          exit 1
