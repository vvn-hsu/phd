# 職缺來源設定。
#
# type:
#   links  - 抓列表頁 HTML，用 link_pattern 找出職缺連結，錨點文字當標題
#   rss    - 抓 RSS/Atom feed
#   jsonld - 抓頁面裡 schema.org JobPosting 的 JSON-LD
#
# 共用欄位：
#   urls        - 候選網址，依序嘗試，第一個抓到東西的就用（其餘跳過）
#   mode        - first（預設）／all：all 會把每個網址都抓一遍再合併，關鍵字搜尋用這個
#   topic_boost - 這個來源本身就是 HCI 導向時，給每筆職缺加的相關度分數
#   delay       - 每次請求之間等幾秒（預設 0.5），對方會 429 的話調大
#   city        - 單一校區的學校可以寫死城市，詳細頁抓不到時用它補
#   enrich      - jsonld：對新職缺再抓一次詳細頁，補發布日／截止日／系所
#   filter      - phd（預設，只留博士職缺）／none（全留）
#   max_enrich  - 每次執行最多補抓幾個詳細頁
#   enabled     - false 時整個來源跳過

defaults:
  filter: phd
  max_enrich: 130
  timeout: 30

sources:
  # 以下兩個是針對 HCI 的關鍵字搜尋。一般來源抓的是「全部領域的最新職缺」，
  # HCI 的缺常常排不進那一頁，所以另外用關鍵字直接搜。
  - id: academictransfer_hci
    name: AcademicTransfer（HCI 關鍵字搜尋）
    country: NL
    homepage: https://www.academictransfer.com/en/jobs?q=human-computer+interaction
    type: links
    enabled: true
    mode: all
    topic_boost: 3
    urls:
      - https://www.academictransfer.com/en/jobs?q=human-computer+interaction
      - https://www.academictransfer.com/en/jobs?q=interaction+design
      - https://www.academictransfer.com/en/jobs?q=user+experience
      - https://www.academictransfer.com/en/jobs?q=usability
      - https://www.academictransfer.com/en/jobs?q=human-centered+design
      - https://www.academictransfer.com/en/jobs?q=human-AI+interaction
      - https://www.academictransfer.com/en/jobs?q=human-robot+interaction
      - https://www.academictransfer.com/en/jobs?q=virtual+reality
      - https://www.academictransfer.com/en/jobs?q=augmented+reality
      - https://www.academictransfer.com/en/jobs?q=eye+tracking
      - https://www.academictransfer.com/en/jobs?q=conversational+agent
      - https://www.academictransfer.com/en/jobs?q=accessibility
      - https://www.academictransfer.com/en/jobs?q=data+visualization
      - https://www.academictransfer.com/en/jobs?q=human+factors
    link_pattern: '/(en|nl)/jobs/\d+'
    enrich: jsonld

  - id: euraxess_hci
    name: EURAXESS（HCI 關鍵字搜尋）
    country: EU
    homepage: https://euraxess.ec.europa.eu/jobs/search?keywords=human-computer%20interaction
    type: links
    # EURAXESS 的 ?keywords= 沒有作用：10 組不同關鍵字回來的是完全同一批職缺
    # （log 裡的樣本標題一模一樣），而且多打幾次就被 429。先關掉。
    enabled: false
    mode: all
    topic_boost: 3
    urls:
      - https://euraxess.ec.europa.eu/jobs/search?keywords=human-computer+interaction
      - https://euraxess.ec.europa.eu/jobs/search?keywords=interaction+design
      - https://euraxess.ec.europa.eu/jobs/search?keywords=user+experience
      - https://euraxess.ec.europa.eu/jobs/search?keywords=usability
      - https://euraxess.ec.europa.eu/jobs/search?keywords=human-robot+interaction
      - https://euraxess.ec.europa.eu/jobs/search?keywords=virtual+reality
      - https://euraxess.ec.europa.eu/jobs/search?keywords=augmented+reality
      - https://euraxess.ec.europa.eu/jobs/search?keywords=eye+tracking
      - https://euraxess.ec.europa.eu/jobs/search?keywords=accessibility
      - https://euraxess.ec.europa.eu/jobs/search?keywords=human+factors
    link_pattern: '/jobs/\d+'
    enrich: jsonld

  - id: academictransfer
    name: AcademicTransfer（荷蘭各大學，含 TU Delft）
    country: NL
    homepage: https://www.academictransfer.com/en/jobs/
    type: links
    enabled: true
    urls:
      - https://www.academictransfer.com/en/jobs/?category=phd&sort=date
      - https://www.academictransfer.com/en/jobs/?category=phd
      - https://www.academictransfer.com/en/jobs/
    link_pattern: '/(en|nl)/jobs/\d+'
    enrich: jsonld

  - id: euraxess
    name: EURAXESS（全歐洲）
    country: EU
    homepage: https://euraxess.ec.europa.eu/jobs/search
    type: links
    enabled: true
    urls:
      # sort[name]=created&sort[direction]=DESC 是站上自己的「最新優先」連結；
      # 不加的話回來的是一批舊的獎學金／研究助理公告
      - https://euraxess.ec.europa.eu/jobs/search?sort%5Bname%5D=created&sort%5Bdirection%5D=DESC&f%5B0%5D=job_research_profile%3A447
      - https://euraxess.ec.europa.eu/jobs/search?sort%5Bname%5D=created&sort%5Bdirection%5D=DESC
      - https://euraxess.ec.europa.eu/jobs/search
    link_pattern: '/jobs/\d+'
    pages: 3           # 一頁 10 筆；翻太多頁會被 429
    delay: 2
    enrich: jsonld

  - id: jobsacuk
    name: jobs.ac.uk（英國）
    country: UK
    homepage: https://www.jobs.ac.uk/search/?keywords=PhD
    type: links
    # 搜尋結果是 JS 渲染的，HTML 裡只有幾則贊助職缺（而且都不是博士），先關掉
    enabled: false
    urls:
      # /search/phd 是導覽頁，列的職缺跟 PhD 無關；keywords 搜尋才是真的結果
      - https://www.jobs.ac.uk/search/?keywords=PhD&sortOrder=1
      - https://www.jobs.ac.uk/search/?keywords=PhD
    link_pattern: '/job/[A-Z]{2,4}\d{2,}'
    pages: 5
    enrich: jsonld

  - id: ethz
    name: ETH Zürich
    city: Zürich
    country: CH
    homepage: https://jobs.ethz.ch/
    type: links
    enabled: true
    urls:
      - https://jobs.ethz.ch/job/search?query=doctoral
      - https://jobs.ethz.ch/
    link_pattern: '/job/view/\d+|/job/\d+'
    enrich: jsonld

  - id: kth
    name: KTH Royal Institute of Technology
    city: Stockholm
    country: SE
    homepage: https://kth.varbi.com/en/
    type: links
    enabled: true
    urls:
      # kth.se 那頁只是 iframe 外殼（而且會回 500），真正的清單在 Varbi
      - https://kth.varbi.com/en/
    link_pattern: 'what:job/jobID:\d+'
    enrich: jsonld

  # DTU 的職缺清單是 JS 渲染的，HTML 裡只有導覽列，先關掉。
  # 要修的話得找出它背後的 API（用 scraper/sniff.py 看）。
  # 下面幾所學校都用 Varbi，版型跟 KTH 一樣，所以同一組 link_pattern 就能抓。
  # 其中某個 subdomain 不存在的話，那個來源會顯示 error，不影響其他來源。
  - id: uu
    name: Uppsala universitet
    city: Uppsala
    country: SE
    homepage: https://uu.varbi.com/en/
    type: links
    enabled: true
    urls: [https://uu.varbi.com/en/]
    link_pattern: 'what:job/jobID:\d+'
    enrich: jsonld

  - id: su
    name: Stockholms universitet
    city: Stockholm
    country: SE
    homepage: https://su.varbi.com/en/
    type: links
    enabled: true
    urls: [https://su.varbi.com/en/]
    link_pattern: 'what:job/jobID:\d+'
    enrich: jsonld

  - id: lu
    name: Lunds universitet
    city: Lund
    country: SE
    homepage: https://lu.varbi.com/en/
    type: links
    enabled: true
    urls: [https://lu.varbi.com/en/]
    link_pattern: 'what:job/jobID:\d+'
    enrich: jsonld

  # liu.varbi.com 不存在（404），Linköping 用的不是 Varbi。
  - id: liu
    name: Linköpings universitet
    city: Linköping
    country: SE
    homepage: https://liu.varbi.com/en/
    type: links
    enabled: false
    urls: [https://liu.varbi.com/en/]
    link_pattern: 'what:job/jobID:\d+'
    enrich: jsonld

  - id: umu
    name: Umeå universitet
    city: Umeå
    country: SE
    homepage: https://umu.varbi.com/en/
    type: links
    enabled: true
    urls: [https://umu.varbi.com/en/]
    link_pattern: 'what:job/jobID:\d+'
    enrich: jsonld

  - id: dtu
    name: DTU（丹麥技術大學）
    city: Kongens Lyngby
    country: DK
    homepage: https://www.dtu.dk/english/about/job-and-career/vacant-positions
    type: links
    enabled: false
    urls:
      - https://www.dtu.dk/english/about/job-and-career/vacant-positions
    link_pattern: 'job[\w\-/]*/\d+|/vacant-positions/job'
    enrich: jsonld

  # KU Leuven 的職缺清單同樣是 JS 渲染，先關掉。
  - id: kuleuven
    name: KU Leuven
    city: Leuven
    country: BE
    homepage: https://www.kuleuven.be/personeel/jobsite/en/vacancies
    type: links
    enabled: false
    urls:
      - https://www.kuleuven.be/personeel/jobsite/en/vacancies?category=phd
      - https://www.kuleuven.be/personeel/jobsite/en/vacancies
    link_pattern: '/jobsite/(en/)?\d+'
    enrich: jsonld

  - id: tum
    name: TU München
    city: München
    country: DE
    homepage: https://portal.mytum.de/jobs/
    type: links
    enabled: true
    urls:
      - https://portal.mytum.de/jobs/wissenschaftler/
      - https://portal.mytum.de/jobs/
    link_pattern: '/jobs/[\w\-]+/[\w\-]+'
    enrich: jsonld

  # Chalmers 的清單是 JS 渲染，chalmers.varbi.com 也不存在，先關掉。
  - id: chalmers
    name: Chalmers
    city: Göteborg
    country: SE
    homepage: https://www.chalmers.se/en/about-chalmers/work-with-us/vacancies/
    type: links
    enabled: false
    urls:
      - https://www.chalmers.se/en/about-chalmers/work-with-us/vacancies/
    link_pattern: 'varbi\.com/[\w\-/]*|/vacancies/[\w\-]+'
    enrich: jsonld

  - id: academicpositions
    name: Academic Positions（歐洲彙整站）
    country: EU
    homepage: https://academicpositions.com/find-jobs/position/phd
    type: links
    # 這個站列表頁的卡片文字會整團被當成標題（"PhD in Informatics Join an
    # interdisciplinary..."），而且多半是「即將開放」的招生廣告、沒有截止日，
    # 對 HCI 沒什麼幫助，先關掉。
    enabled: false
    urls:
      - https://academicpositions.com/find-jobs/position/phd
      - https://academicpositions.com/jobs/position/phd
    link_pattern: '/ad/[\w\-]+/\d+'
    pages: 3
    enrich: jsonld

  - id: ethz_extra
    name: ETH Zürich（第二頁以後）
    country: CH
    homepage: https://jobs.ethz.ch/
    type: links
    enabled: false
    urls:
      - https://jobs.ethz.ch/
    link_pattern: '/job/view/\d+'
    enrich: jsonld
