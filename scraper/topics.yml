# HCI 相關度的關鍵字表。抓取時會用標題、摘要、系所名稱去比對，
# 算出 topic_score 和命中的詞，網頁再拿去篩選。
#
# terms  - 不分大小寫的片語（會當成正則，空白可以用 [- ] 之類的寫法）
# abbrev - 縮寫，必須大小寫完全吻合才算（免得 "ar"、"ux" 在別的字裡誤中）
#
# 想放寬或收緊就直接改這裡的詞或 thresholds。

weights:
  strong: 3
  medium: 2
  weak: 1

thresholds:
  broad: 3     # 網頁預設：HCI 相關（廣泛）
  strict: 6    # 嚴格模式

strong:
