# HCI 相關度的關鍵字表，以及用來快速掃視的中文標籤。
#
# terms / abbrev：算 HCI 相關度用的，格式是「正則: 中文標籤」，每個命中 2 分。
#   abbrev 必須大小寫完全吻合才算（免得 "ar"、"ux" 在別的字裡誤中）。
#   同一個中文標籤可以對到多個正則（例如 VR XR AR），只會算一次。
# fields：不算分，只是貼在卡片上讓人一眼看出這個職缺在做什麼。
#
# 想放寬或收緊就改這裡的詞或 thresholds。

weights:
  strong: 3
  medium: 2
  weak: 1
  penalty: 2   # penalties 每命中一個扣幾分

thresholds:
  broad: 2     # 網頁預設：HCI 相關（廣泛）＝命中一個關鍵字就算
  strict: 6    # 嚴格模式＝命中三個關鍵字，或關鍵字搜尋命中再加一個

medium:
  terms:
    "virtual reality": VR XR AR
    "augmented reality": VR XR AR
    "mixed reality": VR XR AR
    "extended reality": VR XR AR
    "eye[- ]tracking": 眼動追蹤
    "brain[- ]computer interface": 腦機介面
    "haptic": 觸覺回饋
    "wearable": 穿戴式
    "accessibility": 無障礙
    "inclusive design": 包容性設計
    "conversational (agent|interface|ai)": 對話式代理
    "chatbot": 聊天機器人
    "voice (assistant|interface)": 語音介面
    "speech interface": 語音介面
    "dialogue system": 對話系統
    "(information|data|scientific) visuali[sz]ation": 資料視覺化
    "visual analytics": 視覺分析
    "affective computing": 情感運算
    "emotion recognition": 情緒辨識
    "multimodal interaction": 多模態互動
    "gesture (recognition|interaction)": 手勢互動
    "explainable (ai|machine learning)": 可解釋 AI
    "persuasive technolog": 說服式科技
    "serious game": 嚴肅遊戲
    "game design": 遊戲設計
    "teleoperation": 遠端操作
    "situation awareness": 情境覺察
    "behaviou?r change": 行為改變
    "automated driving": 自動駕駛
    "(automated|autonomous|self[- ]driving) (vehicle|car)s?\\b": 自動駕駛
    "driving simulator": 駕駛模擬
    # 車輛 eHMI 這一塊
    "e-?hmi|external (hmi|human[- ]machine interface)": eHMI
    "human[- ]vehicle interaction|automotive (hci|user interface|interface)": 車輛人機介面
    "in[- ]vehicle (interface|hmi|information system)": 車輛人機介面
    "pedestrian (interaction|behaviou?r|crossing|communication)": 行人互動
    "vulnerable road user": 行人互動
    "take[- ]?over request|transition of control|mode awareness": 接手控制
    "driver (monitoring|state estimation|distraction)": 駕駛狀態
    # 數位健康、人與 AI 的關係
    "digital (wellbeing|well-being)|screen time|technology overuse": 數位身心健康
    "human[- ](ai|machine) (teaming|collaboration|partnership)": 人與 AI 協作
    "human[- ]centred ai|human[- ]centered ai": 人與 AI 協作
    "trust in (ai|automation|technology|machines?|robots?)": 對 AI 的信任
    "trustworthy (ai|machine learning|autonomy|automation)": 對 AI 的信任
    "(over|under)[- ]?reliance on (ai|automation)": 對 AI 的信任
    "social computing": 社會運算
    "crowdsourcing": 群眾外包
    "ubiquitous computing": 普適運算
    "cognitive ergonomics": 認知人因
    "participatory design": 參與式設計
    "user interface": 使用者介面
    "design research": 設計研究
  abbrev:
    VR: VR XR AR
    AR: VR XR AR
    XR: VR XR AR
    BCI: 腦機介面
    EEG: 腦電
    XAI: 可解釋 AI

# 扣分詞：一看就不是這條研究線的題目。每命中一個扣 weights.penalty 分，
# 分數最低扣到 0。用途是擋掉「整頁只因為提過一次 user interface 或
# accessibility 就擠進 HCI 清單」的生醫、材料、量子、能源職缺。
# 真的有兩個以上 HCI 關鍵字的職缺扣完還是會留著，所以不會誤殺跨領域的缺。
penalties:
  "(genomic|genome|sequencing|proteomic|transcriptom|crispr|molecular biolog|microbiolog)": 基因體學
  "(perovskite|catalysis|catalyst|polymer synthesis|crystallograph|alloy|corrosion|thin film)": 材料合成
  "(cryptograph|side[- ]channel|formal verification|intrusion detection|malware)": 資安底層
  "(qubit|quantum (comput|optic|material|dot)|superconduct)": 量子元件
  "(photovoltaic|fuel cell|hydrogen|battery (chemistry|material)|power grid|wind turbine)": 能源工程
  "(plant (science|biolog|breeding)|crop|soil|agronom|microbial ecolog|livestock)": 農業生態
  "(astrophys|particle physics|cosmolog|fluid dynamics|combustion|aerodynamic)": 基礎物理
  "(drug (discovery|delivery)|pharmacolog|vaccine|immunolog|oncolog|tumou?r)": 藥學腫瘤
  "(organic chemistry|electrochemi|spectroscop|mass spectrometry|nmr)": 化學分析
  "(tissue engineering|stem cell|biomaterial|regenerative medicine)": 生醫材料

# 語言門檻：要求當地語言的職缺要一眼看得出來。
# 必要（required）和加分（merit）分開，瑞典很多缺是「會瑞典文算加分」，那不該標紅。
languages:
  Dutch: 荷蘭文
  German: 德文
  Deutsch: 德文
  Swedish: 瑞典文
  Svenska: 瑞典文
