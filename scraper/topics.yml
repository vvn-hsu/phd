# HCI 相關度的關鍵字表，以及用來快速掃視的中文標籤。
#
# strong / medium / weak：算 HCI 相關度用的，格式是「正則: 中文標籤」。
#   strong 3 分、medium 2 分、weak 1 分；weak 在整頁計分時不採計
#   （那種字在任何職缺頁的樣板文字裡都會出現）。
# abbrev：縮寫，必須大小寫完全吻合才算（免得 "ar"、"ux" 在別的字裡誤中）。
# fields：不算分，只是貼在卡片上讓人一眼看出這個職缺在做什麼。
#
# 想放寬或收緊就改這裡的詞或 thresholds。

weights:
  strong: 3
  medium: 2
  weak: 1

thresholds:
  broad: 3     # 網頁預設：HCI 相關（廣泛）
  strict: 6    # 嚴格模式

strong:
  terms:
    "human[- ]computer interaction": 人機互動
    "human[- ]centered (computing|design|ai|artificial)": 以人為中心
    "human[- ]centred (computing|design|ai|artificial)": 以人為中心
    "user[- ]centered design": 使用者中心設計
    "user[- ]centred design": 使用者中心設計
    "interaction design": 互動設計
