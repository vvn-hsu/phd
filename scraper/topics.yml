# HCI 相關度的關鍵字表，以及用來快速掃視的中文標籤。
#
# terms / abbrev：算 HCI 相關度用的，格式是「正則: 中文標籤」，每個命中 2 分。
#   abbrev 必須大小寫完全吻合才算（免得 "ar"、"ux" 在別的字裡誤中）。
#   同一個中文標籤可以對到多個正則（例如 VR XR AR），只會算一次。
# fields：不算分，只是貼在卡片上讓人一眼看出這個職缺在做什麼。
#
# 想放寬或收緊就改這裡的詞或 thresholds。

weights:
  strong: 3
  medium: 2
  weak: 1

thresholds:
  broad: 2     # 網頁預設：HCI 相關（廣泛）＝命中一個關鍵字就算
  strict: 6    # 嚴格模式＝命中三個關鍵字，或關鍵字搜尋命中再加一個

medium:
  terms:
    "virtual reality": VR XR AR
    "augmented reality": VR XR AR
    "mixed reality": VR XR AR
    "extended reality": VR XR AR
    "eye[- ]tracking": 眼動追蹤
    "brain[- ]computer interface": 腦機介面
    "haptic": 觸覺回饋
    "wearable": 穿戴式
    "accessibility": 無障礙
    "inclusive design": 包容性設計
    "conversational (agent|interface|ai)": 對話式代理
    "chatbot": 聊天機器人
    "voice (assistant|interface)": 語音介面
    "speech interface": 語音介面
    "dialogue system": 對話系統
    "(information|data|scientific) visuali[sz]ation": 資料視覺化
    "visual analytics": 視覺分析
    "affective computing": 情感運算
    "emotion recognition": 情緒辨識
    "multimodal interaction": 多模態互動
    "gesture (recognition|interaction)": 手勢互動
    "explainable (ai|machine learning)": 可解釋 AI
    "persuasive technolog": 說服式科技
    "serious game": 嚴肅遊戲
    "game design": 遊戲設計
    "teleoperation": 遠端操作
    "situation awareness": 情境覺察
    "behaviou?r change": 行為改變
    "automated driving": 自動駕駛
    "driving simulator": 駕駛模擬
    "social computing": 社會運算
    "crowdsourcing": 群眾外包
    "ubiquitous computing": 普適運算
    "cognitive ergonomics": 認知人因
    "participatory design": 參與式設計
    "user interface": 使用者介面
    "design research": 設計研究
  abbrev:
    VR: VR XR AR
    AR: VR XR AR
    XR: VR XR AR
    BCI: 腦機介面
    EEG: 腦電
    XAI: 可解釋 AI

