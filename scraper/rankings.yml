# 學校排名（手動維護）
#
# 為什麼是手動維護：QS／THE 官網要 JS 才渲染、也不給免費 API；維基百科的
# 排名條目只有前 25 名的表格（已經實測過），對 TU Delft、KTH、Lund 這種
# 名次完全不夠用。所以這裡用「區間」而不是精確名次——區間我敢寫，
# 精確到個位數的名次每年都在動，寫下去只會是假精確。
#
# 想要精確名次的話：在任何一條加 `qs: 49` 這樣的欄位，網頁會優先顯示它。
#
# key 是比對學校名稱用的正則（不分大小寫，部分比對）。
# band 只能用下面這幾個值，網頁依這個順序排序。

source: QS World University Rankings（世界綜合排名，區間為人工歸類）
bands: ["1-10", "11-50", "51-100", "101-200", "201-500", "未列入"]

universities:
  # 1-10
  "ETH Z[uü]rich|Swiss Federal Institute of Technology": "1-10"
  "University College London|\\bUCL\\b": "1-10"

